# Deliberately incompatible: Qwen3 base with Gemma 4 parents. The tool must refuse.
name: cross-family-negative
base_model: ./work/models/Qwen3-4B-Base
parents:
  - {name: gpt, model: ./work/models/gemma-4-E4B}
  - {name: git, model: ./work/models/gemma-4-E4B-it}
method: linear
population: 4
genes: 3
evaluation:
  device: cpu
  tasks:
    arc_easy: {metric: 'acc_norm,none', weight: 1.0}
    hellaswag: {metric: 'acc_norm,none', weight: 1.0}
