# Paths below are placeholders: ./work holds the downloaded models (./work/models/...) and trained adapters (./work/adapters_*).
# Evolution vs random search on Qwen2.5-0.5B: ARC-Easy LoRA + PIQA LoRA. Search items: first 100 of each task.
name: q05-evo
base_model: ./work/models/Qwen2.5-0.5B
parents:
  - {name: arc, model: ./work/adapters_trained/arc}
  - {name: piqa, model: ./work/adapters_trained/piqa}
mode: lora
method: linear
selection: pareto
population: 6
genes: 3
mutation_sigma: 0.15
seed: 21
out_dtype: float32
gene_groups: [attention, mlp, other]
evaluation:
  device: xpu
  batch_size: 8
  num_fewshot: 0
  apply_chat_template: false
  limit: 100
  penalty: 0.1
  tasks:
    arc_easy: {metric: 'acc_norm,none', weight: 1.0}
    piqa: {metric: 'acc_norm,none', weight: 1.0}
