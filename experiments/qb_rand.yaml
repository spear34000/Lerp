# Evolution vs random search: ARC-Easy LoRA + BoolQ LoRA (complementary skills). Search items: first 100 per task.
name: qb-rand
base_model: ./work/models/Qwen2.5-0.5B
parents:
  - {name: arc, model: ./work/adapters_trained/arc}
  - {name: boolq, model: ./work/adapters_trained/boolq}
mode: lora
method: linear
selection: pareto
population: 24
genes: 3
mutation_sigma: 0.15
seed: 31
out_dtype: float32
gene_groups: [attention, mlp, other]
evaluation:
  device: xpu
  batch_size: 8
  num_fewshot: 0
  apply_chat_template: false
  limit: 100
  penalty: 0.1
  tasks:
    arc_easy: {metric: 'acc_norm,none', weight: 1.0}
    boolq: {metric: 'acc,none', weight: 1.0}
